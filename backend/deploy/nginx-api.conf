# api.pha-app.net для общего nginx-site на fest: /srv/nginx/conf.d/pha-api.conf.
# Сертификат выпускает certbot (webroot), продлевает cron на хосте.
server {
    listen 80;
    server_name api.pha-app.net;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://api.pha-app.net$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.pha-app.net;

    ssl_certificate /etc/letsencrypt/live/api.pha-app.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.pha-app.net/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;

    # /analyze принимает файлы до 8 МБ.
    client_max_body_size 10m;

    location / {
        proxy_pass http://172.17.0.1:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 180s;
    }
}
